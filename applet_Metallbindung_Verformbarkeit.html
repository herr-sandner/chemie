<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verformbarkeit: Ionengitter – Metallgitter – Legierung</title>
<style>
  :root{
    --akzent:#2E5AAC; --akzent-dunkel:#1c3a72;
    --grau:#666; --bg:#ffffff; --panel:#f2f5fb; --rand:#cdd8ee;
    --rumpf:#4B4B4B; --elektron:#F7B832; --kation:#E07828; --anion:#37965F;
    --warn:#C62828;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b1b1b;background:var(--bg);}
  .wrap{max-width:1040px;margin:0 auto;padding:16px;}
  h1{font-size:1.25rem;color:var(--akzent-dunkel);margin:.2rem 0 1rem;}
  .layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;}
  .figur{flex:2 1 500px;min-width:320px;}
  .seite{flex:1 1 270px;min-width:250px;}
  svg{width:100%;height:auto;touch-action:none;user-select:none;}
  text{font-family:inherit;}
  .panel{background:var(--panel);border:1px solid var(--rand);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .readout .zeile{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--rand);}
  .readout .zeile:last-child{border-bottom:none;}
  .readout .lab{color:var(--grau);font-size:.95rem;flex:0 0 auto;}
  .readout .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:1rem;text-align:right;}
  .controls label{display:block;font-size:.9rem;color:var(--grau);margin:.2rem 0 .3rem;}
  input[type=range]{width:100%;accent-color:var(--akzent);}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  button{font:inherit;border:1px solid var(--akzent);background:#fff;color:var(--akzent);border-radius:8px;padding:7px 12px;cursor:pointer;}
  button:hover{background:var(--akzent);color:#fff;}
  button:focus-visible{outline:3px solid #9db6e6;outline-offset:2px;}
  button.aktiv{background:var(--akzent);color:#fff;}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.88rem;color:var(--grau);}
  .opt input{width:17px;height:17px;accent-color:var(--akzent);}
  .legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--grau);margin-top:6px;}
  .legende span{display:flex;align-items:center;gap:5px;}
  .dot{display:inline-block;border-radius:50%;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Warum zerbricht der Salzkristall und das Metall nicht?</h1>

  <div class="tabs" role="group" aria-label="Modell wählen">
    <button id="tIon" class="aktiv">Ionengitter</button>
    <button id="tMet">reines Metall</button>
    <button id="tLeg">Legierung</button>
  </div>

  <div class="layout">
    <div class="figur">
      <svg id="fig" viewBox="0 0 520 400" aria-label="Gittermodell: die obere Hälfte des Gitters wird gegen die untere verschoben; die Teilchen bewegen sich dabei ständig">
        <g id="szene"></g>
      </svg>
      <div class="legende" id="leg"></div>
    </div>

    <div class="seite">
      <div class="panel readout">
        <div class="zeile"><span class="lab">Verschiebung</span><span class="val" id="rShift">0 %</span></div>
        <div class="zeile"><span class="lab">Was liegt jetzt gegenüber?</span><span class="val" id="rNachbar">–</span></div>
        <div class="zeile"><span class="lab">Folge</span><span class="val" id="rFolge">–</span></div>
      </div>

      <div class="panel controls">
        <label for="s">Obere Hälfte verschieben: <b id="sLab">0 %</b></label>
        <input id="s" type="range" min="0" max="100" step="1" value="0" aria-label="Verschiebung der oberen Gitterhälfte in Prozent">
        <div class="btns">
          <button id="play">▶ verschieben</button>
          <button id="reset">zurück</button>
        </div>
        <div class="opt">
          <input type="checkbox" id="bew" checked>
          <label for="bew" style="margin:0">Teilchenbewegung</label>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const NS='http://www.w3.org/2000/svg';
  const COLS=[80,150,220,290,360], ROWS=[70,140,210,280];
  const DX=70, DY=70, R=26, RBIG=38;
  const YLIM=1;
  let modus='ion', t=0, playing=false, raf=null, tt=0, dirty=true;

  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let bewegung=!reduce;
  $('bew').checked=bewegung;

  const GROSS=[[2,1],[3,2],[1,3]];
  const istGross=(c,r)=>GROSS.some(g=>g[0]===c&&g[1]===r);

  // Schwingung der Rümpfe/Ionen um die Gitterplätze
  const SW=[];
  for(let i=0;i<COLS.length*ROWS.length;i++)
    SW.push({p:Math.random()*6.28, q:Math.random()*6.28, f:0.8+Math.random()*0.7});

  // Ungeordnete Bewegung der Elektronen
  const EL=[];
  [105,175,245].forEach(y=>[45,115,185,255,325,395].forEach(x=>{
    const a=Math.random()*6.28;
    EL.push({x:x,y:y,vx:Math.cos(a)*0.9,vy:Math.sin(a)*0.9});
  }));
  function schrittElektronen(){
    EL.forEach(e=>{
      if(Math.random()<0.04){                    // "Stoß": neue Richtung
        const a=Math.random()*6.28, v=0.6+Math.random()*0.7;
        e.vx=Math.cos(a)*v; e.vy=Math.sin(a)*v;
      }
      e.x+=e.vx; e.y+=e.vy;
      if(e.x<42||e.x>438) e.vx*=-1;
      if(e.y<88||e.y>262) e.vy*=-1;
      e.x=Math.max(42,Math.min(438,e.x));
      e.y=Math.max(88,Math.min(262,e.y));
    });
  }

  function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}

  function kugel(g,x,y,rad,fill,label,stroke){
    g.appendChild(el('circle',{cx:x,cy:y,r:rad,fill:fill,stroke:stroke||'rgba(0,0,0,.35)','stroke-width':stroke?3:1}));
    if(label){
      const tx=el('text',{x:x,y:y+7,'text-anchor':'middle','font-size':rad>30?26:22,'font-weight':'700',fill:'#fff'});
      tx.textContent=label; g.appendChild(tx);
    }
  }

  function zeichne(){
    const g=$('szene'); g.textContent='';
    const off=t*DX;
    const spalt=(modus==='ion'&&t>0.7)?((t-0.7)/0.3)*42:0;
    const A=bewegung?2.6:0;

    g.appendChild(el('line',{x1:40,y1:175-spalt/2,x2:480,y2:175-spalt/2,stroke:'#b8c2d6','stroke-width':1.5,'stroke-dasharray':'7 6'}));

    if(modus!=='ion'){
      EL.forEach(e=>{
        const f=Math.max(0,Math.min(1,(210-e.y)/70));
        let x=e.x+off*f;
        if(x>468) x-=DX*6;
        kugel(g,x,e.y-spalt*f,9,'var(--elektron)','','#5a4210');
      });
    }

    ROWS.forEach((y0,r)=>{
      const dx=(r<=YLIM)?off:0;
      const yb=(r<=YLIM)?y0-spalt:y0;
      COLS.forEach((x0,c)=>{
        const s=SW[r*COLS.length+c];
        const x=x0+dx+A*Math.sin(s.f*tt+s.p);
        const y=yb+A*Math.cos(s.f*0.9*tt+s.q);
        if(modus==='ion'){
          const plus=((c+r)%2===0);
          kugel(g,x,y,R,plus?'var(--kation)':'var(--anion)',plus?'+':'–');
        }else if(modus==='met'){
          kugel(g,x,y,R,'var(--rumpf)','+');
        }else{
          const gr=istGross(c,r);
          kugel(g,x,y,gr?RBIG:R,'var(--rumpf)','+',gr?'#1f5fbf':null);
        }
      });
    });

    if(modus==='ion'&&t>0.5){
      const op=Math.min(1,(t-0.5)/0.3);
      COLS.forEach((x0,c)=>{
        const x=x0+off;
        if(x>365) return;
        const oben=((c+1)%2===0), unten=((Math.round((x-80)/DX)+2)%2===0);
        if(oben!==unten) return;
        g.appendChild(el('path',{d:`M ${x} ${152-spalt} L ${x} ${138-spalt}`,stroke:'var(--warn)','stroke-width':3,opacity:op}));
        g.appendChild(el('path',{d:`M ${x-7} ${145-spalt} L ${x} ${134-spalt} L ${x+7} ${145-spalt}`,fill:'none',stroke:'var(--warn)','stroke-width':3,opacity:op}));
        g.appendChild(el('path',{d:`M ${x} ${198} L ${x} ${212}`,stroke:'var(--warn)','stroke-width':3,opacity:op}));
        g.appendChild(el('path',{d:`M ${x-7} ${205} L ${x} ${216} L ${x+7} ${205}`,fill:'none',stroke:'var(--warn)','stroke-width':3,opacity:op}));
      });
    }

    if(modus==='leg'){
      const xg=220+off, dist=Math.hypot(290-xg,DY);
      if(dist<RBIG*2){
        g.appendChild(el('circle',{cx:(xg+290)/2,cy:175,r:26,fill:'none',stroke:'var(--warn)','stroke-width':4}));
        const w=el('text',{x:(xg+290)/2,y:184,'text-anchor':'middle','font-size':30,'font-weight':'700',fill:'var(--warn)'});
        w.textContent='!'; g.appendChild(w);
      }
    }

    const a=el('text',{x:40,y:36,'font-size':15,fill:'#666'}); a.textContent='obere Hälfte →'; g.appendChild(a);
    const b=el('text',{x:40,y:344,'font-size':15,fill:'#666'}); b.textContent='untere Hälfte (fest)'; g.appendChild(b);
  }

  const TEXTE={
    ion:{
      leg:[['var(--kation)','Kation +'],['var(--anion)','Anion –']],
      nachbar:x=>x<0.5?'+ und – wechseln sich ab':(x<0.75?'gleiche Ladungen rücken zusammen':'+ über + und – über –'),
      folge:x=>x<0.5?'Gitter hält':(x<0.75?'Abstoßung beginnt':'Kristall zerbricht')
    },
    met:{
      leg:[['var(--rumpf)','Atomrumpf +'],['var(--elektron)','Elektron des Elektronengases']],
      nachbar:x=>'Rümpfe + Elektronengas',
      folge:x=>x<0.1?'Ausgangslage':'Gitter gleitet, Bindung bleibt'
    },
    leg:{
      leg:[['var(--rumpf)','Atomrumpf (zwei Größen)'],['var(--elektron)','Elektron des Elektronengases']],
      nachbar:x=>x<0.58?'Rümpfe + Elektronengas':'großer Rumpf trifft großen Rumpf',
      folge:x=>x<0.58?'gleitet noch':'Verschiebung blockiert → härter'
    }
  };

  function textUpdate(){
    const T=TEXTE[modus];
    $('rShift').textContent=Math.round(t*100)+' %';
    $('sLab').textContent=Math.round(t*100)+' %';
    $('rNachbar').textContent=T.nachbar(t);
    $('rFolge').textContent=T.folge(t);
    $('leg').innerHTML=T.leg.map(([f,n])=>
      `<span><i class="dot" style="width:14px;height:14px;background:${f}"></i>${n}</span>`).join('');
  }

  function setT(v){ t=Math.max(0,Math.min(1,v)); $('s').value=Math.round(t*100); dirty=true; textUpdate(); }

  function stop(){ playing=false; $('play').classList.remove('aktiv'); $('play').textContent='▶ verschieben'; if(raf)clearTimeout(raf); }
  function schieben(){ if(!playing)return; if(t>=1){stop();return;} setT(t+0.012); raf=setTimeout(schieben,20); }

  function anim(){
    if(bewegung){ tt+=0.06; schrittElektronen(); zeichne(); }
    else if(dirty){ zeichne(); dirty=false; }
    requestAnimationFrame(anim);
  }

  $('s').addEventListener('input',e=>{ stop(); setT(e.target.value/100); });
  $('play').addEventListener('click',()=>{ if(playing){stop();return;} if(t>=1)setT(0);
    playing=true; $('play').classList.add('aktiv'); $('play').textContent='⏸ Pause'; schieben(); });
  $('reset').addEventListener('click',()=>{ stop(); setT(0); });
  $('bew').addEventListener('change',e=>{ bewegung=e.target.checked; dirty=true; });

  function wechsel(m,btn){ stop(); modus=m; ['tIon','tMet','tLeg'].forEach(i=>$(i).classList.remove('aktiv'));
    btn.classList.add('aktiv'); setT(0); }
  $('tIon').addEventListener('click',e=>wechsel('ion',e.currentTarget));
  $('tMet').addEventListener('click',e=>wechsel('met',e.currentTarget));
  $('tLeg').addEventListener('click',e=>wechsel('leg',e.currentTarget));

  textUpdate();
  requestAnimationFrame(anim);
})();
</script>
</body>
</html>
